# Deploys the site to GitHub Pages (Pages source: "GitHub Actions").
#
# The DNF repository is never committed to this repo (RPMs exceed GitHub's
# 100 MB per-file limit): each release carries the whole repo as one tar.zst
# asset, and this workflow extracts it under repositories/ (archive-root
# layout: the three repos ai-custom-infra/, ai-custom-infra-source/,
# ai-custom-infra-debuginfo/) and publishes the result as the Pages artifact
# (actions/deploy-pages).
#
# Triggers:
#   - release: published -> deploy that release's asset. NOTE: use
#     `published`, NOT `created` — a release created already-published (e.g.
#     via `gh release create`) fires `published`, not `created`.
#   - push: main -> redeploy web/ with the latest release's asset
#     (static site only while no release exists).
#
# Only dependencies: first-party actions/* (checkout, upload-pages-artifact,
# deploy-pages) + preinstalled runner tools (gh, zstd, tar). See AGENTS.md
# for the invariants.

name: deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

# Two deploys must never run concurrently: they would race on the Pages
# deployment. The second run waits instead.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Find the archive to deploy:
      #   - release event -> that release's tag
      #   - push event    -> the latest release
      #   - no release yet -> static site only
      # The event can arrive before the asset upload finishes, so poll for
      # the asset before downloading.
      - name: Download repo archive
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          fi
          if [ -z "$tag" ]; then
            echo "No release yet - deploying static site only."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Waiting for asset of release $tag ..."
          deadline=$((SECONDS + 600))
          until gh release view "$tag" --json assets \
               --jq '.assets | map(.name) | join(" ")' | grep -qE 'ai-custom-infra-.*\.tar\.zst'; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "error: release $tag has no tarball asset after 10 minutes" >&2
              exit 1
            fi
            sleep 15
          done
          gh release download "$tag" --pattern 'ai-custom-infra-*.tar.zst' --dir "$RUNNER_TEMP/asset"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag"

      # Assemble the site: web/ verbatim + the three extracted DNF repos.
      # Fail loudly if the archive does not contain all three repos, each
      # with readable repodata.
      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p build
          cp -r web/. build/

          # The three repos live at the archive root; extract them under
          # build/repositories/ so the archive-root layout is preserved
          # (repomd.xml references repo-relative $releasever/$basearch paths).
          repos="ai-custom-infra ai-custom-infra-source ai-custom-infra-debuginfo"

          if [ "${{ steps.asset.outputs.found }}" = "true" ]; then
            mkdir -p build/repositories
            archive="$(ls "$RUNNER_TEMP"/asset/ai-custom-infra-*.tar.zst)"
            tar --zstd -xf "$archive" -C build/repositories
            # Every repo must be a usable DNF repo: repomd.xml + >=1 .rpm.
            for repo in $repos; do
              repo_dir="build/repositories/$repo"
              test -f "$repo_dir/repodata/repomd.xml" \
                || { echo "error: $repo has no repodata/repomd.xml" >&2; exit 1; }
              n=$(find "$repo_dir" -name '*.rpm' | wc -l)
              [ "$n" -ge 1 ] \
                || { echo "error: $repo has no .rpm (nothing classified into it)" >&2; exit 1; }
              echo "  $repo: $n RPMs"
            done

            base="https://enricotagliavini.github.io/repositories"
            # Combined .repo file (all three repos; source & debuginfo
            # disabled), served from the main repo folder where baseurl points.
            {
              printf '[ai-custom-infra]\n'
              printf 'name=AI Custom Infra\n'
              printf 'baseurl=%s/ai-custom-infra/\n' "$base"
              printf 'enabled=1\ngpgcheck=0\n\n'
              printf '[ai-custom-infra-source]\n'
              printf 'name=AI Custom Infra - Source\n'
              printf 'baseurl=%s/ai-custom-infra-source/\n' "$base"
              printf 'enabled=0\ngpgcheck=0\n\n'
              printf '[ai-custom-infra-debuginfo]\n'
              printf 'name=AI Custom Infra - Debuginfo\n'
              printf 'baseurl=%s/ai-custom-infra-debuginfo/\n' "$base"
              printf 'enabled=0\ngpgcheck=0\n'
            } > build/repositories/ai-custom-infra/ai-custom-infra.repo
            # Matches AGENTS.md's client install contract: baseurl points at the
            # deployed repo folders, and the combined file lists all three.
            {
              echo '<!doctype html>'
              echo '<html lang="en"><head><meta charset="utf-8">'
              echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
              echo '<title>ai-custom-infra repositories</title>'
              echo '<style>:root{color-scheme:light dark}body{font-family:system-ui,sans-serif;max-width:46rem;margin:3rem auto;padding:0 1rem;line-height:1.5}code{font-family:ui-monospace,monospace;font-size:.92em}a{color:#0645ad}ul{line-height:1.8}</style>'
              echo '</head><body>'
              echo '<h1>ai-custom-infra repositories</h1>'
              echo '<p><a href="../">&larr; home</a></p>'
              echo '<p>Self-produced Fedora RPMs, organized by release version. Packages are unsigned.</p>'
              echo '<ul>'
              echo '<li><strong>ai-custom-infra</strong> — binary RPMs (<a href="ai-custom-infra/">packages</a>)</li>'
              echo '<li><strong>ai-custom-infra-source</strong> — source RPMs (<a href="ai-custom-infra-source/">packages</a>)</li>'
              echo '<li><strong>ai-custom-infra-debuginfo</strong> — debuginfo/debugsource RPMs (<a href="ai-custom-infra-debuginfo/">packages</a>)</li>'
              echo '</ul>'
              echo '<p>Install: download <a href="ai-custom-infra/ai-custom-infra.repo"><code>ai-custom-infra.repo</code></a> and drop it into <code>/etc/yum.repos.d/</code>, then run <code>sudo dnf makecache</code>.</p>'
              echo '</body></html>'
            } > build/repositories/index.html
            # Per-repo package listings (every RPM, across version dirs).
            for repo in $repos; do
              repo_dir="build/repositories/$repo"
              {
                echo '<!doctype html>'
                echo '<html lang="en"><head><meta charset="utf-8">'
                echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
                echo "<title>$repo - packages</title>"
                echo '<style>:root{color-scheme:light dark}body{font-family:system-ui,sans-serif;max-width:46rem;margin:3rem auto;padding:0 1rem;line-height:1.5}code{font-family:ui-monospace,monospace;font-size:.92em}table{border-collapse:collapse;width:100%}td,th{padding:.3rem .75rem .3rem 0;text-align:left}tr{border-bottom:1px solid rgba(127,127,127,.25)}a{color:#0645ad}</style>'
                echo '</head><body>'
                echo "<h1>$repo</h1>"
                echo '<p><a href="../..">&larr; home</a> &middot; <a href="repodata/repomd.xml">repodata</a></p>'
                echo '<p>Download <a href="../ai-custom-infra/ai-custom-infra.repo"><code>ai-custom-infra.repo</code></a> and drop it into <code>/etc/yum.repos.d/</code>, then run <code>sudo dnf makecache</code>.</p>'
                echo '<h2>Packages</h2>'
                echo '<table><tr><th>package</th><th>size</th></tr>'
                while IFS= read -r -d '' rpm; do
                  relpath=$(realpath --relative-to="$repo_dir" "$rpm")
                  b=$(basename -- "$rpm")
                  s=$(numfmt --to=iec "$(stat -c%s "$rpm")")
                  echo "<tr><td><a href=\"$relpath\"><code>$b</code></a></td><td>$s</td></tr>"
                done < <(find "$repo_dir" -name '*.rpm' -type f -print0 | sort -z)
                echo '</table>'
                echo '</body></html>'
              } > "$repo_dir/index.html"
            done
          fi
          echo "site files: $(find build -type f | wc -l)"

      # Publish the build directory as the Pages site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
